name: Receita mensal · Radar Cloudflare

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

# Standard Linux runners are free for this PUBLIC repository. Do not enable this
# job in a private repository or choose a paid/larger runner.
permissions:
  contents: read

concurrency:
  group: radar-receita-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verificar protocolo sem rede
        run: python tools/cloudflare_receita_sync.py --self-test
      - name: Conferir competência e atualizar somente quando necessário
        env:
          RADAR_WORKERS_URL: ${{ secrets.RADAR_WORKERS_URL }}
          RADAR_RECEITA_IMPORT_SECRET: ${{ secrets.RADAR_RECEITA_IMPORT_SECRET }}
        run: python tools/cloudflare_receita_sync.py
      # No artifact/cache upload: source contacts and temporary SQLite remain on
      # the ephemeral runner and are removed by TemporaryDirectory on completion.
      # GitHub may disable scheduled workflows after 60 days without repo activity.
